name: mel_capital
description: "Mel Capital — kişisel borç, kart, hesap ve harcama takibi."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  file_selector: ^1.0.3
  # Telefon eşitlemesi: QR kodu okuma (yalnızca telefonda), QR çizimi ve AES-GCM şifreleme
  mobile_scanner: ^7.0.0
  # Abonelik logoları: Simple Icons SVG yollarını çizmek için
  path_parsing: ^1.1.0
  path_provider: ^2.1.5
  # Ekstre: PDF'in yazısını cihazın içinde okumak için (PDFium)
  pdfrx: ^2.11.0
  pointycastle: ^3.9.1
  qr: ^3.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/sample/
    - assets/shops/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Rakamlar (tutarlar ve büyük sayılar). Dosyaları tool/yazi_tipi.py hazırlar (SIL OFL).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
